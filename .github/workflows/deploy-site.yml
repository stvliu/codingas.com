name: Deploy Site

# 官网构建与部署：master push -> Cloudflare Pages 生产；pull_request -> 预览。
# 本仓库为官网源码独立仓库（从 llm-gateway/site 迁出），工作目录即仓库根。
#
# ⚠️ Gitee 不运行 GitHub Actions：此工作流文件保留以备仓库镜像到 GitHub 时复用。
#    在 Gitee 上需改用 Gitee Go（.gitee/workflow/）或 Cloudflare Pages 直连 Gitee 仓库触发部署。
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 版本由 .nvmrc 锁定（当前 20）。
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          PUBLIC_SITE_URL: https://codingas.com

      - name: Slug check
        run: pnpm lint:slugcheck

      - name: Link check
        run: pnpm lint:linkcheck

      # 部署到 Cloudflare Pages。
      # master push 触发生产部署；PR 触发预览部署（由 Cloudflare Pages 按 branch 自动判定）。
      # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 需在仓库 Secrets 配置。
      # project-name 需在 Cloudflare 控制台预先创建对应项目（codingas-com）。
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=codingas-com
